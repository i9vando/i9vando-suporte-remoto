name: Gerar aplicativos I9VANDO

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de homologação ou publicação"
        required: true
        default: "i9vando-homologacao"
      build_windows:
        description: "Gerar Windows x64"
        type: boolean
        default: true
      build_macos:
        description: "Gerar macOS Intel e Apple Silicon"
        type: boolean
        default: true
      build_linux:
        description: "Gerar Linux x64 (.deb e .rpm)"
        type: boolean
        default: true
      build_android:
        description: "Gerar Android (APK universal)"
        type: boolean
        default: false
      build_ios:
        description: "Gerar iOS (IPA sem assinatura Apple)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Validar configuração I9VANDO
        run: ./scripts/validate-i9vando-release.sh

  compilar:
    needs: validar
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.release_tag }}
      publish-update-metadata: false
      build_windows: ${{ inputs.build_windows }}
      build_macos: ${{ inputs.build_macos }}
      build_linux: ${{ inputs.build_linux }}
      build_android: ${{ inputs.build_android }}
      build_ios: ${{ inputs.build_ios }}
    secrets: inherit
