services:
  hbbs:
    image: ${RUSTDESK_IMAGE:-rustdesk/rustdesk-server:1.1.16}
    container_name: i9vando-remoto-hbbs
    command: hbbs -r ${RUSTDESK_HOST}:21117
    depends_on:
      - hbbr
    ports:
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
      - "21118:21118/tcp"
    volumes:
      - ./data:/root
    restart: unless-stopped
    networks:
      - i9vando-remoto

  hbbr:
    image: ${RUSTDESK_IMAGE:-rustdesk/rustdesk-server:1.1.16}
    container_name: i9vando-remoto-hbbr
    command: hbbr
    ports:
      - "21117:21117/tcp"
      - "21119:21119/tcp"
    volumes:
      - ./data:/root
    restart: unless-stopped
    networks:
      - i9vando-remoto

networks:
  i9vando-remoto:
    name: i9vando-remoto
